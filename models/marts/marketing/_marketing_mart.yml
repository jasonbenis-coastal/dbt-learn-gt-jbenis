models:
  - name: dim_customers
    config:
      contract: 
        enforced: true
      group: marketing
      access: protected
    columns:
      - name: customer_id
        data_type: integer
        constraints:
          - type: unique
            warn_unenforced: false
          - type: not_null
      - name: first_name
        data_type: string
        constraints:
          - type: not_null
      - name: last_name
        data_type: string
        constraints:
          - type: not_null
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
      - name: lifetime_value
        data_type: numeric(38,6)
      - name: number_of_orders
        data_type: number(18,0)
      - name: employee_id
        data_type: integer