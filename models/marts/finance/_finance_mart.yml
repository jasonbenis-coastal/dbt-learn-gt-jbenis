models:
  - name: fct_orders
    config:
      contract: 
        enforced: true
      group: finance
      access: protected
    columns:
      - name: order_id
        data_type: integer
        constraints:
          - type: unique
            warn_unenforced: false
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: integer
        constraints:
          - type: not_null
      - name: order_date
        data_type: date
        constraints:
          - type: not_null
      - name: order_amount
        data_type: numeric(38,2)